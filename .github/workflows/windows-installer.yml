name: Windows installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows-installer.yml'
      - 'packaging/**'
      - 'requirements*.txt'
      - 'requirements/**'
      - 'desktop.py'
      - 'desktop_app/**'
      - 'app.py'
      - 'config.py'
      - 'graph.py'
      - 'web/**'
      - 'knowledge/**'
      - 'agents/**'
      - 'tests/**'
      - 'docs/基于3820战略工程内容的多智能体系统搭建指南.md'
      - 'docs/3820背景.md'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - name: Install dependencies
        run: python -m pip install -r requirements/desktop.txt
      - name: Offline tests
        run: python -m pytest -m offline -q
      - name: Build application
        run: python -m PyInstaller --noconfirm packaging/3820Agent.spec
      - name: Check high DPI manifest
        shell: pwsh
        run: |
          python -c "from PyInstaller.utils.win32.winmanifest import read_manifest_from_executable; data = read_manifest_from_executable(r'dist\3820Agent\3820Agent.exe'); assert b'PerMonitorV2' in data"
      - name: Executable smoke test
        shell: pwsh
        run: |
          & .\dist\3820Agent\3820Agent.exe --smoke-test
          if ($LASTEXITCODE -ne 0) {
            $log = Join-Path $env:APPDATA '3820Agent\desktop.log'
            if (Test-Path $log) { Get-Content $log -Tail 80 }
            exit $LASTEXITCODE
          }
      - name: Install Inno Setup compiler
        shell: pwsh
        run: |
          if (-not (Test-Path 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe')) {
            choco install innosetup --no-progress -y
          }
      - name: Build installer
        shell: pwsh
        run: |
          $compiler = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $compiler)) { $compiler = 'C:\Program Files\Inno Setup 6\ISCC.exe' }
          & $compiler packaging\3820Agent.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install and smoke test installer
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP '3820AgentInstall'
          $installer = (Resolve-Path 'dist\installer\3820Agent-Setup-x64.exe').Path
          $process = Start-Process -FilePath $installer -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /DIR=$target /TASKS=desktopicon" -Wait -PassThru
          if ($process.ExitCode -ne 0) { exit $process.ExitCode }
          $installed = Join-Path $target '3820Agent.exe'
          if (-not (Test-Path $installed)) { throw 'Installed executable missing' }
          if (-not (Test-Path (Join-Path $target '3820Agent.ico'))) { throw 'Installed icon missing' }
          $startMenu = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs'
          $startShortcut = Get-ChildItem $startMenu -Filter '3820 战略知识助手.lnk' -Recurse | Select-Object -First 1
          $desktopShortcut = Join-Path ([Environment]::GetFolderPath('DesktopDirectory')) '3820 战略知识助手.lnk'
          if (-not $startShortcut) { throw 'Start Menu shortcut missing' }
          if (-not (Test-Path $desktopShortcut)) { throw 'Desktop shortcut missing' }
          foreach ($shortcutPath in @($startShortcut.FullName, $desktopShortcut)) {
            $linkBytes = [System.IO.File]::ReadAllBytes($shortcutPath)
            $linkHex = [Convert]::ToHexString($linkBytes)
            foreach ($fileName in @('3820Agent.exe', '3820Agent.ico')) {
              $ascii = [Convert]::ToHexString([System.Text.Encoding]::ASCII.GetBytes($fileName))
              $unicode = [Convert]::ToHexString([System.Text.Encoding]::Unicode.GetBytes($fileName))
              if (-not ($linkHex.Contains($ascii) -or $linkHex.Contains($unicode))) {
                throw "Shortcut $shortcutPath does not reference $fileName"
              }
            }
          }
          & $installed --smoke-test
          if ($LASTEXITCODE -ne 0) {
            $log = Join-Path $env:APPDATA '3820Agent\desktop.log'
            if (Test-Path $log) { Get-Content $log -Tail 80 }
            exit $LASTEXITCODE
          }
      - uses: actions/upload-artifact@v4
        with:
          name: 3820Agent-Windows-x64-Setup
          path: dist/installer/3820Agent-Setup-x64.exe
          if-no-files-found: error
